<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
</head>
<body>
    This is home
    {%for n in clist%}
    <div>{{forloop.counter0}} {{n}}</div>
    {%endfor%}

    <br>


    <table border="1" cellpadding="10">
        <tr>
            <th>name</th>
            <th>phone number</th>
        </tr>

        {%for d in student_details %}
        <tr>
            <td>{{d.name}}</td>
            <td>{{d.phone}}</td>

        </tr>
        {%endfor%}
    </table>

    {%if number|length > 0 %}
        {%for i in number %}
            {%if i > 12%}
             <div>{{i}}</div>
            {%endif%}
        {%endfor%}

    {% else %}
        This is an empty list
    

    {%endif%}


</body>
</html>
